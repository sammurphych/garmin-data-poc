# Render Blueprint: Cube Core (semantic layer) on Render's free web service.
# It sleeps after ~15 min idle; the first request after that takes ~30-60 s to wake it.
services:
  - type: web
    name: health-cube
    runtime: docker
    plan: free
    dockerfilePath: ./semantic/Dockerfile
    dockerContext: ./semantic
    healthCheckPath: /readyz
    buildFilter:
      paths:
        - semantic/**
    envVars:
      - key: CUBEJS_DB_DUCKDB_DATABASE_PATH
        value: md:health
      - key: CUBEJS_DB_DUCKDB_MOTHERDUCK_TOKEN  # the dashboards token (MOTHERDUCK_READ_TOKEN)
        sync: false
      - key: motherduck_token                   # same token again; the MotherDuck extension reads this name itself
        sync: false
      - key: CUBEJS_API_SECRET                  # same value as CUBEJS_API_SECRET in .env
        sync: false

  # The MCP server for claude.ai (semantic/mcp_remote.py), behind a one-person OAuth sign-in.
  # Render generates the three secrets; copy the client id/secret into claude.ai and the password into
  # your password manager. Regenerating MCP_SIGNING_KEY signs claude.ai out (revokes every token).
  - type: web
    name: health-mcp
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --only-group mcp
    startCommand: uv run --no-sync python semantic/mcp_remote.py
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - semantic/mcp_server.py
        - semantic/mcp_remote.py
        - pyproject.toml
        - uv.lock
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CUBE_API_URL                       # https://<health-cube service>.onrender.com/cubejs-api/v1
        sync: false
      - key: CUBEJS_API_SECRET                  # same value as on the health-cube service
        sync: false
      - key: MCP_OAUTH_CLIENT_ID
        generateValue: true
      - key: MCP_OAUTH_CLIENT_SECRET
        generateValue: true
      - key: MCP_LOGIN_PASSWORD
        generateValue: true
      - key: MCP_SIGNING_KEY
        generateValue: true
