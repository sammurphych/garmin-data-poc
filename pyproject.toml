[project]
name = "garmin-data-poc"
version = "0.1.0"
description = "POC: dlt + MotherDuck + SQLMesh + Cube + Evidence, orchestrated by Prefect Cloud"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.0",
    "dlt[motherduck]>=1.0",
    "sqlmesh>=0.150",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "sqlfluff>=3.4",
    "sqlmesh[lsp]>=0.236.4",
]
mcp = [  # also everything the health-mcp Render service installs (uv sync --only-group mcp)
    "mcp>=2.3",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[tool.uv]
package = false
# cryptography 49+ ships no Intel-Mac wheels, and building it from source needs Rust and Xcode tools.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]
