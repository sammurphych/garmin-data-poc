[project]
name = "garmin-data-poc"
version = "0.1.0"
description = "POC: dlt + MotherDuck + SQLMesh + Cube + Evidence, orchestrated by Prefect Cloud"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.0",
    "dlt[motherduck]>=1.0",
    "sqlmesh>=0.150",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
mcp = [
    "mcp>=1.2",
    "pyjwt>=2.8",
]

[tool.uv]
package = false
